<!doctype html>
<html lang="en" class="waking">
<head>
<meta charset="utf-8">
<!-- No zooming. This is a room drawn to the size of the screen, with a
     conversation projected onto a pane inside it — pinched to 1.4 it is a
     corner of a room and a column of type running off the edge, and a phone
     that zooms in on a focused field leaves it there. The scale is fixed so
     that what a phone shows is what was laid out for it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Before any stylesheet: the browser paints the blank canvas between two
     documents using this, and reads it while parsing the head. Declaring
     dark in CSS is too late — that is the white flash on navigation. -->
<meta name="color-scheme" content="dark">
<!-- The bands a phone keeps for itself, above the notch and below the home
     bar, are painted with this. Black is not the color of any of these rooms
     — the parlour's dark is a plum and the library's is nearly brown — so a
     black band top and bottom frames the room in something that is not in it.
     A starting value here for the first paint, and the room's own void put in
     its place as soon as one is built. See paintEdges. -->
<meta name="theme-color" content="#0a0610">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The face this wears everywhere: a tab, a home screen, an installed
     window. One photograph of a sunset, cut to every size somebody asks for
     — see shell/static/icons. Flat squares that bleed to the edge, because
     each platform rounds or masks them its own way; the maskable one is the
     same picture standing back from its edges so a circular crop takes sky
     rather than cloud. -->
<!-- PNG first, .ico last. A browser is entitled to take the first icon it
     understands, and every one of them understands a PNG; the .ico is here
     for the ones that ask the root of the site for that name and nothing
     else. -->
<link rel="icon" type="image/png" sizes="32x32" href="/shared/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/shared/icons/icon-16.png">
<link rel="icon" href="/shared/icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/shared/icons/icon-180.png">
<link rel="manifest" href="/shared/manifest.webmanifest">
<title>Lucid Talk</title>
<!-- Inline, and first: the shared stylesheet is a separate request, and a
     browser paints a new document before the stylesheet arrives. Without
     this the first frame of every navigation is white — invisible in
     Safari, which covers it with a view transition, and a flash in
     Firefox, which has none. -->
<style>html{background:#05060b}</style>
<link rel="stylesheet" href="/shared/night.css?v=3">
<style>
  :root {
    /* The same room as the shell, named the way this page already speaks:
       the palette moved to /shared/night.css, and these are its local names.
       Panels are translucent now — there is a sky behind them. */
    --bg:transparent; --panel:rgba(14,17,25,.72); --line:var(--edge);
    --text:var(--ink); --dim:var(--star-dim);
    --accent:var(--brass); --good:#9a9b3c; --warn:#d9932f; --bad:#b5482c;
    --you:rgba(30,24,14,.66);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  /* ---- the room ---------------------------------------------------------
     The room is rendered, not laid out: /shared/room3d.js builds it in WebGL
     from the numbers in personas/<slug>/room.js. What is left here is the
     canvas it draws on, and the one piece of the app that is still HTML.
  */
  body { margin:0; height:100vh; height:100dvh; overflow:hidden;
         background:#07050c; color:var(--text);
         overscroll-behavior:none; touch-action:manipulation; }
  #stage { position:fixed; inset:0; z-index:0; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* The void closing in from the edges of the picture. Centered on the heart of
     the room rather than on the middle of the browser window, because the
     composition is what it belongs to — the engine keeps --eye-x/y pointed at
     it. Drawn over the canvas and under the conversation, so the words stay
     out of it. */
  #stage.vignetted::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse var(--vig-w, 120%) var(--vig-h, 120%)
                 at var(--eye-x, 50%) var(--eye-y, 50%),
               transparent var(--vig-hold, 30%), var(--void, #07050c) 100%);
  }

  /* The conversation, lying on the glass.

     It is a flat page of its own fixed size, and every frame the engine hands
     it the projection that lands its four corners on the four corners of the
     window in the room. So it leans with the wall — the words are in the
     room's perspective rather than pasted over a picture of one — while
     staying real text you can select, scroll and read a screen reader from.
  */
  #glass { position:fixed; left:0; top:0; z-index:1; transform-origin:0 0;
           display:flex; will-change:transform;
           -webkit-font-smoothing:antialiased; }

  /* No room.
     Some machine somewhere has no WebGL, or the room throws, or the graphics
     context is taken away mid-conversation. None of that should cost anybody
     the conversation — so the glass stops being a plane in a room and becomes
     what it already nearly is: a column of text down the middle of the screen.
     One class, and the projection stands down (--px back to 1, no transform).
     It is a perfectly good chat, which is the point. */
  html.flat #stage { display:none; }
  html.flat body { background:var(--room-ground, #07050c); }
  /* Type included: out here there is no glass to take a share of, and no
     perspective shrinking it either — this is a page, read at a page's size. */
  html.flat #glass { --px:1; --type:15px; left:50%; top:0; transform:translateX(-50%);
                     width:min(760px, 92vw); height:100vh; height:100dvh; }
  html.flat #glass::before { display:none; }
  html.flat #chat { padding-top:max(24px, env(safe-area-inset-top)); }

  /* Waking.
     Until the room has been tried there is no telling which of the two this
     is, and the glass looks wrong in the meantime — a page with no projection
     on it yet is a column of text stretched down the screen. So both are held
     back behind a mark that says the place is opening, and whichever it turns
     out to be arrives already looking like itself. */
  html.waking #stage, html.waking #glass { opacity:0; }
  #stage, #glass { transition:opacity .45s ease; }
  #waking { position:fixed; inset:0; z-index:5; display:grid; place-items:center;
            pointer-events:none; transition:opacity .3s ease; }
  html:not(.waking) #waking { opacity:0; visibility:hidden; }
  /* What a room shows while it is being built: its own figure, breathing.
     The parlour's is a diamond, which is what its walls are ruled with; the
     library's is the spiral its floor is. Both are the same mark the card in
     the box was backed with, so the thing you pressed is the thing that keeps
     you waiting — and there is no third state to design, because a room that
     names no figure gets the diamond, which is the house shape. */
  #waking i { display:block; width:26px; height:26px; transform:rotate(45deg);
              border:1px solid rgba(var(--room-accent, 141,92,214), .55);
              animation:opening 1.7s ease-in-out infinite; }
  @keyframes opening {
    0%, 100% { opacity:.25; transform:rotate(45deg) scale(.82); }
    50%      { opacity:.9;  transform:rotate(45deg) scale(1); }
  }
  /* Turning rather than pulsing, because that is what a spiral is for: a
     figure with a direction in it says "working" where a fading one says
     "waiting". Painted with the room's accent through a mask, so it is the
     same color the diamond would have been. */

  @keyframes winding {

    50%  {                           opacity:.85; }
    to   { transform:rotate(360deg); opacity:.4; }
  }
  @media (prefers-reduced-motion: reduce) {
    #waking i, html[data-figure="spiral"] #waking i { animation:none; opacity:.6; } }
  #chatwrap { position:relative; flex:1; min-height:0; display:flex; overflow:hidden; }
  /* The conversation scrolls and does not say so. A scrollbar down the glass
     is a piece of operating system laid over a room — the one thing on that
     pane that belongs to no part of this — and it is drawing a bright line
     through a window somebody is reading a scene through. Nothing is lost by
     taking it away: the last line is followed on its own, and the way back
     down when you have scrolled up is the tip that already appears for it.
     Wheel, trackpad, touch and keys are untouched. */
  #chat { scrollbar-width:none; -ms-overflow-style:none;
          flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
          overscroll-behavior:contain;
          padding:calc(1.1em) calc(1.3em) calc(1.4em + var(--under, 0px));
          font-size:calc(var(--type) * var(--px, 1));
          display:flex; flex-direction:column;
          /* Enough that the corner controls of one line clear the next. */
          gap:calc(1.05em); }
  #chat::-webkit-scrollbar { width:0; height:0; }
  /* A short conversation sits on the bottom of the glass rather than hanging
     from the top of it, and this is the way to say that on something which
     also scrolls. `justify-content:flex-end` says it more plainly and is a
     trap: once the conversation is taller than the box, the overflow goes out
     of the *top*, where scrollTop cannot reach it. scrollHeight stayed equal
     to clientHeight and twenty thousand pixels of talk sat above the frame
     with no way back to it — the room had no history at all, and the only
     visible symptom was a ↓ latest button that would not go away. An auto
     margin on the first line does the same job and leaves the overflow at the
     end, where scrolling is. */
  #chat > *:first-child { margin-top:auto; }
  /* Sized in real screen pixels, not in the page's own.

     The glass is a plane in a room, so anything written on it comes out at
     whatever size the perspective makes of it — which changes every time the
     window is resized. The engine measures that and hands the page --px, the
     number of page pixels in a screen pixel, so a size asked for here is the
     size it arrives at. --type is the type on the glass; the panel's own is
     13px, and the conversation should be a little larger than its controls,
     not twice them.

     And it keeps its share of the glass, whatever size the glass came out.
     Held at one size it is right in a full-screen window and shouting in a
     half-width one, where everything else in the room has come down with the
     viewport and the writing has not. Tied to the window instead it climbs
     past the room, which stops growing once the camera has framed it — the
     shelves and the door stay put and the conversation goes on getting bigger.

     So the engine hands over --glass-px, the width the glass actually came out
     on screen, and the type is a share of that: a twenty-seventh, which is
     about thirty characters to the line and the size these want to be read at.
     Bounded at both ends — below eleven it is a squint, above seventeen it is
     a poster — and the fallback is the glass at its usual width, for the frame
     before the first measurement. */
  #glass { --type:clamp(11px, calc(var(--glass-px, 320px) * .0366), 17px); }
  #glass .msg { max-width:80%; line-height:1.45;
                font-size:calc(var(--type) * var(--px, 1));
                padding:.45em .7em; border-radius:.9em; }
  #glass .who { font-size:.72em; margin-bottom:.1em; }
  #glass .note { font-size:.85em; }
  /* Straddling the corner, in the type's own units so it stays put when the
     projection changes size.

     Including the buttons: the app's own `button` rule pins them to 13px, and
     13px on a page hung at the far end of a room is not 13px on the screen —
     it came out half the size of the words beside it on a desk and about
     right on a phone. Inheriting the message's size instead means the icons
     are a fixed fraction of the text, wherever the camera is standing. */
  #glass .tools { right:.4em; bottom:-.6em; gap:.1em; padding:.1em .2em; }
  #glass .tools button { font-size:.88em; padding:.16em; }
  #glass .tools button svg { width:1.15em; height:1.15em; }

  /* ---- who you are with, along the top --------------------------------- */
  .thermo { width:11px; height:11px; flex:0 0 auto; opacity:.85; }
  /* Who you are with: the first row of the panel. Nothing of this app floats
     in the corners of the room — the room is the room, and everything you can
     press is in one place. */
  /* Wrapping, and every child allowed to be narrower than its content wants.
     Without min-width:0 a flex child never shrinks below its own text, which
     is why a row that fits in one browser overflows in the next: the same
     select is simply wider there. */
  /* ---- the deck --------------------------------------------------------
     Keys with some travel in them: a face, a lit edge along the top, and a
     shadow under it that shortens when it goes down. Chunky enough for a
     thumb, and the labels stay words. */
  #deck { display:flex; align-items:flex-end; flex-wrap:wrap; gap:7px 7px; }
  /* The writing line, when there is one. It takes the space the keys leave
     and no more, so the panel stays a row of controls with somewhere to write
     rather than a form with some buttons under it. */
  /* A width worth writing in, or a row of its own.

     Asked for nothing and given whatever was spare, it ended up about a
     hundred and thirty pixels wide whatever the window was doing — the keys
     take the row and the panel is set by the room, not by the screen — and its
     own placeholder wrapped inside it. A line you cannot see a sentence in is
     not a line, it is a slot.

     So it asks for a real width. If the keys leave that much it sits among
     them and grows into whatever else is spare; if they do not, the row wraps
     and it takes a line under them, which is the same arrangement a phone gets
     and for the same reason. The counter is narrow enough now to stay up on
     the row either way. */
  /* Its own height, not the row's. Stretched, it copied whatever the tallest
     thing on the line happened to be — the stacked counter — and stood five
     pixels above the keys, which is exactly enough for a row to stop looking
     like one. Two rows of this type plus its padding comes to the height of a
     key, so all three line up by being the same size rather than by being
     told to. */
  #say { flex:1 1 0; min-width:0; display:flex; align-items:flex-end; }
  /* hidden means hidden. Every `display` in this file outranks the browser's
     own [hidden] rule, so a thing given the attribute stayed on screen — and
     the four rules that used to sit here naming individual elements were four
     people finding that out separately. The microphone key was the fifth: on
     an address that cannot have a microphone it was told to go and did not,
     while the console said it was not there. */
  [hidden] { display:none !important; }
  #say #text { width:100%; min-width:0; resize:none;
               padding:4px 9px; font-size:12px; line-height:1.42;
               overflow-y:auto; }
  /* A hint is not writing, and should not be the same weight as it: at the
     same color the box reads as already having something in it. */
  #say #text::placeholder { color:var(--dim); opacity:.75; }
  .key { flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
         gap:2px; min-width:54px; min-height:0; padding:6px 8px 5px;
         cursor:pointer; border-radius:7px 7px 9px 9px;
         color:var(--text);
         background:linear-gradient(#2a2530, #17141d);
         border:1px solid rgba(255,255,255,.09);
         border-top-color:rgba(255,255,255,.16);
         box-shadow:0 2px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
         transition:transform .06s, box-shadow .06s, background .15s, color .15s; }
  .key i { font-style:normal; font-size:15px; line-height:1;
           display:flex; align-items:center; justify-content:center; }
  .key i svg { width:19px; height:19px; display:block; }
  /* The waiting circle is drawn a hair smaller than the live one, and they
     are the same circle. A pale shape on a dark key spreads — put the white
     one and the red one side by side at the same radius and the white reads
     larger, which is exactly the wrong way round for the one that is not
     doing anything. Measured they were identical; seen they were not, and
     what is seen is the part that counts. */
  .key.rec:not(.armed) i svg { transform:scale(.93); }
  .key span { font-size:8.5px; letter-spacing:1.3px; text-transform:uppercase;
              color:var(--dim); }
  .key:hover { color:var(--ink); }
  .key:hover span { color:var(--text); }
  /* Pressed, and it stays down while what it started is happening. */
  .key:active, .key.down { transform:translateY(2px);
                           box-shadow:0 0 0 rgba(0,0,0,.55), inset 0 2px 5px rgba(0,0,0,.5); }
  .key.down { background:linear-gradient(#1b1822, #221e2a); }
  .key[disabled] { opacity:.35; cursor:default; transform:none;
                   box-shadow:0 2px 0 rgba(0,0,0,.55); }
  /* The two record keys. What goes on the tape comes through one of them —
     Talk is the mic, Type is a line to write in — and neither is armed until
     you say so, which is what the color is for: a white circle waiting, a
     red one live. It used to be red either way, on a red key, which read as a
     warning about something rather than an offer of two ways to speak. */
  .key.rec i { color:#e9e5f0; transition:color .15s; }
  .key.rec.armed i { color:#e0644f; }
  /* A level, along the foot of the Talk key and nowhere else. Small on
     purpose: it is here to answer "is it hearing me" while something is being
     set up, not to be watched. A pair of meters across the panel was a second
     thing moving in a room that is already moving, and the room is the part
     worth looking at. */
  #t-rec { position:relative; overflow:hidden; }
  #t-rec::after { content:""; position:absolute; left:0; bottom:0; height:2px;
                  width:var(--lvl, 0%);
                  background:#ff8a72; box-shadow:0 0 6px rgba(255,138,114,.8);
                  transition:width .08s linear; }
  /* And only the microphone blinks. A blink says "this is happening, now",
     which is true of a mic that is open and listening and is not true of a
     line waiting to be typed into: nobody types continuously, and a light
     pulsing at somebody who has stopped to think is a light asking them to
     hurry up. */
  #t-rec.armed i { color:#ff6a4d; animation:blink var(--beat, 1.6s) ease-in-out infinite; }
  .key.playing i { color:var(--good); }

  /* The counter: which turn this is, and how much tape a Play would give. */
  /* The two readouts sit one above the other, not side by side. They are the
     narrowest things in the panel and the writing line is the widest, and a
     row puts them in competition: the counter takes a hundred and twenty
     pixels it does not need and the line wraps its own placeholder. Stacked,
     the counter is as wide as the wider of the two and the line gets the rest.
     Right-aligned so the digits keep a common edge, which is what makes a
     column of numbers readable at a glance. */
  #counter { margin-left:auto; display:flex; flex-direction:column;
             align-items:flex-end; gap:2px;
             font-variant-numeric:tabular-nums; }
  #turns { font-size:14px; letter-spacing:2px; color:var(--text);
           padding:1px 7px; border-radius:5px;
           background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.08); }
  /* How much tape is left, as a clock rather than as a word. "15 min" is a
     label; a pair of digits counting down is the machine telling you where it
     has got to, which is what the rest of this panel is doing. The colon
     blinks while it is running, and only then — a still colon is a tape that
     is not moving, and you can tell at a glance across the room. */
  #tape { display:inline-flex; align-items:baseline; gap:0;
          font-size:13px; letter-spacing:1.5px; white-space:nowrap;
          padding:2px 7px; border-radius:5px; color:#f0c98a;
          background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.08);
          text-shadow:0 0 7px rgba(240,201,138,.45); }
  #tape i { font-style:normal; }
  #tape em { font-style:normal; padding:0 1px; }
  #tape.running em { animation:tick 1s steps(1, end) infinite; }
  /* Held: the colon stops where it is and the whole thing steps back, so a
     stopped clock is legible as stopped from across the room rather than as
     one that merely happens to be between blinks. */
  #tape.holding { color:var(--dim); text-shadow:none; }
  @keyframes tick { 0%, 49% { opacity:1; } 50%, 100% { opacity:.12; } }
  /* Run out, and it says so by going the color of a thing that has stopped. */
  #tape.spent { color:var(--dim); text-shadow:none; }

  /* ---- the panel: the one thing every room shares ----------------------- */
  /* Centered unless a room says otherwise: --panel-x is where its middle sits,
     so a room with something to show on one side can push it to the other.

     But only as far as there is room to. A room asks for a fraction of the
     window, and a fraction of a narrow window puts a 760px panel through the
     left edge — which makes a perfectly good desktop look like a phone, and
     then cuts the controls off it.

     So the offset is held between two walls: never nearer either edge than
     half the panel's own width plus a margin. Whatever a room asks for, the
     panel slides back towards the middle as the window narrows and stops
     while it is all still on screen. This is computed on the panel itself
     rather than on :root, because a custom property is resolved where it is
     declared — a --panel-x set further down would otherwise be read too late
     to matter. */
  :root { --panel-w:min(760px, 92vw); }
  #panel {
    --panel-at:clamp(calc(var(--panel-w) / 2 + 12px),
                     var(--panel-x, 50%),
                     calc(100% - var(--panel-w) / 2 - 12px));
  }
  /* And a room's offset is only worth honouring while there is a room beside
     it to leave clear. Under this the panel comes back to the middle instead
     of standing against the left edge. On the elements, so it still beats a
     room's stylesheet, which can only reach :root. */
  @media (max-width:1320px) {
    #panel { --panel-x:50%; }
  }
  #panel { position:fixed; z-index:3; transform:translateX(-50%);
           left:var(--panel-at);
           bottom:max(20px, env(safe-area-inset-bottom));
           width:var(--panel-w);
           display:flex; flex-direction:column; gap:6px;
           padding:12px 14px 10px; border-radius:18px;
           background:rgba(10,7,16,.8);
           border:1px solid rgba(var(--room-accent), .3);
           box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 26px 60px rgba(0,0,0,.6),
                      0 0 60px rgba(var(--room-accent), .12);
           backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #controls { display:flex; flex-direction:column; gap:8px; }

  /* Only shown once you have scrolled away from the bottom. */
  #jump { position:absolute; left:50%; transform:translateX(-50%); bottom:12px;
          font-size:12px; padding:5px 12px; border-radius:999px; background:#241a0e;
          border:1px solid var(--line); color:var(--text); box-shadow:0 3px 10px rgba(0,0,0,.5);
          opacity:.95; z-index:2; }
  .msg { position:relative; max-width:74%; padding:7px 11px; border-radius:13px;
         font-size:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  /* Say it again — the mic cuts it off on a cough, and a line you missed is
     otherwise gone.

     They sit on the bubble's own corner, half in and half out of it, rather
     than in a strip of padding reserved for them along the bottom. The window
     is a small container and the words are the point: a line of padding kept
     empty against the chance of a hover is a line of text nobody can read. */
  .tools { position:absolute; right:6px; bottom:-9px; display:flex; gap:2px;
           padding:2px 3px; border-radius:999px;
           background:rgba(10,7,16,.78); border:1px solid rgba(255,255,255,.12);
           backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
           opacity:0; transition:opacity .15s; }
  /* A line that arrived while the sound was off. The words are on the glass
     and the voice was dropped, which from in here is indistinguishable from a
     line that was simply quiet — so the bubble says so itself, beside the
     text, without waiting to be hovered. Hovering is not a thing a phone
     does, and this is exactly the case somebody meets on one. */
  .msg .unheard { position:absolute; right:6px; top:-9px; display:flex;
                  min-height:0; padding:2px; line-height:0; cursor:pointer;
                  color:var(--warn, #d9932f); opacity:.85;
                  background:var(--panel, #1b1b22); border:1px solid var(--line, #33333d);
                  border-radius:999px; }
  .msg .unheard:hover { opacity:1; }
  .msg .unheard svg { width:13px; height:13px; }
  .tools button { min-height:0; padding:2px; line-height:0; border:0;
                  background:none; color:var(--dim); cursor:pointer; }
  .msg:hover .tools, .tools button:focus { opacity:1; }
  .tools .replay:hover { color:var(--accent); }
  .tools .del:hover { color:var(--bad); }
  /* A phone has no hover, so there they stay visible and quiet instead. */
  @media (hover: none) { .tools { opacity:.4; } }
  /* Nothing to replay or delete until the line is finished — mid-stream they
     read as controls that do not work. */
  .msg.streaming .tools { display:none; }

  .msg.you { align-self:flex-end; background:var(--you); border-bottom-right-radius:4px;
             border:1px solid rgba(201,162,39,.16);
             backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  /* No shadow under either of them: they are on the glass, not floating in
     front of it, and a cast shadow says the wrong thing about where they are. */
  /* The other half of the conversation. There was a `.pill` in here as well —
     the lamps in the strip along the bottom of the panel — and it made every
     one of these a flex row, so the name sat beside the text instead of over
     it. That strip is gone and so is the rule; this is the only `.pill` on
     the page now. Third time a name has been quietly shared by two things
     that had nothing to do with each other, after `.row` and `.deck`. */
  .msg.pill { align-self:flex-start; background:var(--panel); border:1px solid var(--rim);
             border-bottom-left-radius:4px;
             backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .who { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim);
         margin-bottom:3px; }
  /* The record key blinks while the mic is open, and faster when it can hear
     you — the meter is the key itself rather than a lamp beside it. */
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  .tag { color:var(--accent); opacity:.8; }
  .note { align-self:center; font-size:12px; color:var(--dim); font-style:italic; }
  /* Your turn, before the words exist: it hears you now, the transcript
     arrives a second later. Without this the screen says nothing while you
     talk and the reply seems to come out of nowhere. */
  .msg.pending { opacity:.7; }
  /* Something you did, not something you said. */
  .msg.hand .body { font-style:italic; opacity:.82; }
  .msg.hand .who { opacity:.7; }
  .dots { display:inline-flex; gap:5px; align-items:center; height:1em; }
  .dots b { width:6px; height:6px; border-radius:50%; background:var(--dim);
            animation:blink 1.2s ease-in-out infinite; }
  .dots b:nth-child(2) { animation-delay:.2s; }
  .dots b:nth-child(3) { animation-delay:.4s; }

  /* No rule along the top. There was a row of buttons above this once and the
     line divided the two; with that gone it was drawing a line under nothing. */
  #controls { padding:12px 16px;
              background:linear-gradient(transparent, rgba(255,255,255,.025));
              display:flex; flex-direction:column; gap:10px; }
  /* Said once, above the keys, when the machine has been taken to another
     window: the keys still look pressable and nothing they do would reach
     this conversation. A page that has stopped meaning anything should say
     so rather than go quiet. */
  #taken, #gone { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
           padding:8px 12px; border-radius:9px; font-size:12.5px;
           color:#e9c98f; background:rgba(120,80,20,.22);
           border:1px solid rgba(217,164,65,.32); }
  #taken span, #gone span { flex:1; min-width:120px; }
  #taken button, #gone button { padding:5px 10px; font-size:12px; }
  /* Not a warning about somebody else — a dead end. Said in the color this
     program uses for something that has gone wrong rather than something that
     is merely elsewhere. */
  #gone { color:#e9a184; background:rgba(90,38,23,.28);
          border-color:rgba(90,38,23,.6); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; color:var(--text); background:#1d1710;
           border:1px solid var(--line); border-radius:8px; padding:7px 13px; cursor:pointer; }
  button:hover:not(:disabled) { background:#2a2114; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:600; }
  button.danger { background:#33170f; border-color:#5a2617; color:#e9a184; }
  /* These two change their labels while you are reaching for them — Send /
     Stop & send, Start models / Starting… / Stop models. Sized for the
     longest, they keep still: a button that resizes between your press and
     your release takes the click with it and nothing happens. */
  #send { min-width:112px; }
  #session { min-width:124px; }
  button.danger:hover:not(:disabled) { background:#411d12; }
  input[type=text], textarea, select {
        font:inherit; font-size:13px; color:var(--text); background:#17120b;
        border:1px solid var(--line); border-radius:8px; padding:7px 11px; }
  input[type=text] { flex:1; min-width:180px; }
  /* The room's own color when it has the focus, not the browser's blue. It
     is the only field on the page and it is usually the focused thing, so
     that ring was on screen most of the evening. */
  input[type=text]:focus, textarea:focus {
        outline:none; border-color:rgba(var(--room-accent), .55);
        box-shadow:0 0 0 2px rgba(var(--room-accent), .14); }
  label.chk { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }

  /* Two tight lines of status, sized so the pair stands as tall as the
     button beside them and no taller. */
  /* Asking before something cannot be undone. In the page's own colors,
     because a browser dialog arrives in a different typeface wearing the
     name of the machine. */
  #ask { position:fixed; inset:0; z-index:20; display:flex; align-items:center;
         justify-content:center; background:rgba(0,0,0,.6); padding:20px; }
  .askbox { max-width:420px; background:var(--panel); color:var(--text);
            border:1px solid var(--line); border-radius:14px; padding:18px 20px;
            box-shadow:0 18px 50px rgba(0,0,0,.6); }
  .askbox h2 { margin:0 0 8px; font-size:15px; font-weight:600; }
  .askbox p { margin:0 0 16px; font-size:13px; line-height:1.5; color:var(--dim); }
  .askrow { display:flex; justify-content:flex-end; gap:10px; }

  .frow { display:flex; align-items:center; gap:6px 14px; min-width:0; flex-wrap:wrap; }
  .frow > span:empty { display:none; }
  .s { width:7px; height:7px; border-radius:50%; background:#4a3d29; }
  .s.ready { background:var(--good); } .s.loading,.s.starting { background:var(--warn); }
  .s.error { background:var(--bad); }
  /* the one thing you cannot tell by looking: whether the browser is really
     canceling its voice out of what the microphone hears */
  #micinfo.bare { color:var(--warn); }
  #log { flex:1; min-width:0; text-align:right; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap; }

  /* ---- phone ---------------------------------------------------------- */
  @media (max-width:700px), (pointer:coarse) {
    /* The screen belongs to the conversation: Start, the mic switch and a
       text box. Everything else lives behind More. */
    input[type=text], textarea, select { font-size:16px; }
    button { min-height:44px; padding:8px 12px; font-size:14px; }

    /* A phone is the same room from closer in — the engine's portrait camera
       does that. All that changes here is the chat's own type, and that the
       panel comes back to the middle: there is no room beside it to leave. */
    /* A phone holds the screen closer than a desk holds a monitor. */
    #glass { --type:16px; }
    #glass .msg { max-width:88%; }
    /* Set here rather than on --panel-x: a room's own stylesheet loads after
       this one, and a variable it sets would win even on a phone. */
    #panel { left:50%; }
    #panel { width:calc(100% - 20px); padding:10px 12px 8px; }
    /* The deck keeps all four keys and the counter on one line: on a phone
       they were a hair too wide together and the tape length ran off the
       right-hand edge. */
    /* The line you type and the key that sends it stay on one line: wrapped,
       Send took a whole row of a panel that is trying to be small. */
    #say { flex-wrap:nowrap; }
    /* Sixteen pixels, and not for legibility. A phone zooms the whole page in
       when a field it is focusing has type smaller than that, and the zoom
       does not go back on its own — so a line typed into a room leaves the
       room bigger than it was, every time. The one number that stops it is
       this one, and it costs a slightly larger line of type in a place where
       somebody is typing anyway. */
    #say #text { min-width:0; font-size:16px; line-height:1.35; }
    #say #send { flex:0 0 auto; }
    /* Six keys and a counter across a phone: the keys give up what they can
       and the tape length gives up its place — it is in Play's tooltip and on
       the box, and the turn number is the one worth keeping in the corner. */
    .key { min-width:41px; padding:6px 4px 5px; }
    .key i svg { width:20px; height:20px; }
    /* Condensed rather than dropped. Eight keys and a counter across a phone
       is tight, and everything here gives up a little so that all of it fits
       on one row: the labels lose half a pixel and most of their tracking, the
       keys their padding. */
    .key span { font-size:7.5px; letter-spacing:.2px; }
    .key { min-width:29px; padding:6px 2px 5px; }
    #deck { gap:2px; }
    /* And the clock stays. Stacked it costs no width at all — only the height
       of a line it was already sharing with the turn count — and how much tape
       is left is the one number that changes while you are looking at it. */
    #counter { gap:2px; }
    #turns { font-size:12px; padding:1px 4px; letter-spacing:1px; }
    #tape { font-size:12px; padding:1px 4px; letter-spacing:.5px; }
    /* And on a phone there is nothing spare, so the line takes one of its own
       under the keys rather than a sliver between them — after the counter,
       so the counter stays up on the row with the keys instead of being
       pushed down to a line of its own. */
    #say { flex:1 0 100%; order:1; }

    #chat { padding:calc(.9em) calc(1em) calc(1em + var(--under, 0px));
            gap:calc(.85em); }
    #jump { min-height:0; }
    .msg { max-width:88%; font-size:15px; }

    #controls { padding:8px 12px; gap:6px; }
    /* No disclosure: what is left either belongs on screen or nowhere. The
       minutes field keeps its default; the device pickers are Mac hardware. */

    /* one bar, then one row to type — nothing else by default */
    #text { flex:1 1 auto; min-width:0; }
    #send { flex:0 0 auto; }

    /* stack each entry: title and time on one line, the preview under it */

    /* Models and RAM on one line, what is happening right now on the next. */
    .frow { gap:9px; flex-wrap:wrap; }
    .frow.now { gap:2px 9px; }
    #session { min-height:34px; padding:5px 10px; font-size:12px; flex:0 0 auto; }
  }

  /* ---- the notch ------------------------------------------------------
     Last, so it survives the phone rules above: standalone from the home
     screen the page owns the whole screen, notch and home bar included. */
  @supports (padding:max(0px)) {


    #controls { padding-left:max(18px, env(safe-area-inset-left));
                padding-right:max(18px, env(safe-area-inset-right)); }

    @media (max-width:700px), (pointer:coarse) {

               padding-left:max(12px, env(safe-area-inset-left));

<body>
<!-- The room, rendered into here by /shared/room3d.js from the numbers in
     personas/<slug>/room.js. Nothing of the app is in it. -->
<div id="stage" aria-hidden="true"></div>

<!-- Shown only while it is not yet known whether there is a room. -->
<div id="waking" aria-hidden="true"><i></i></div>

<!-- And the one thing that is not rendered: the conversation, laid on the
     window's glass by the projection the engine works out each frame. -->
<div id="glass">
  <div id="chatwrap">
    <div id="chat"></div>
    <button id="jump" hidden>&darr; latest</button>
  </div>
</div>

<!-- What the pill remembers and what you have already said to it are sheets now,
     shared with the box's dashboard — see static/sheets.js. They used to be
     two panels hung off this one, which only made sense from inside a room. -->

<!-- The panel: the one thing every room shares. Only its colors change. -->
<!-- What is left of the panel: a microphone, whether the pill keeps going, a line
     to type, and a way to send it. Everything that used to sit along the top
     of it — which pill, how it is taking you, New, History, Memory — are in
     the console now, where the rest of the machinery already lives. A row of
     buttons over a conversation is a row of buttons you stop seeing, and each
     one was a thing this window had to be wide enough to hold. -->
<div id="panel">
  <!-- The deck. A conversation is a tape: linear, positional, replayable and
       finite, so the controls of a tape are honest about it rather than
       decoration over something else. Say it again, let it run on its own,
       talk, stop the tape and take it out.

       Four keys and a counter, not the six of the machine this is looking at:
       a row of identical black keys under six-point labels is charming and
       unusable. The posture is borrowed, the legibility is not given up —
       every key keeps a word under it and a sentence in its tooltip. -->
  <div id="controls">
    <div id="taken" hidden>
      <span>another window has the machine</span>
      <button type="button" id="takeback">take it back</button>
    </div>
    <!-- The other way a page can be pointed at nothing: an address naming a
         conversation that is not there. Same shape as the banner above and
         for the same reason — a page that has quietly stopped meaning
         anything should say so, and offer the one thing that still works. -->
    <div id="gone" hidden>
      <span>this conversation is not here</span>
      <button type="button" id="goback">back to the box</button>
    </div>
    <div id="deck">
      <button id="t-back" class="key" title="say the last line again — useful when a cough cut it off">
        <i data-icon="again"></i><span>Again</span></button>
      <!-- Play and Pause are two keys, not one, for the reason a cassette
           player has two: they answer different questions. Play is whether
           the tape is running at all; Pause is whether the sound is moving
           right now. One key doing both meant its meaning depended on whether
           a voice happened to be going — so pressing Play a second after
           Skip, meaning "keep it rolling", paused a sentence instead, and
           looked exactly like a key that did nothing. -->
      <button id="t-play" class="key" title="let it carry on by itself; talk any time to steer">
        <i data-icon="play"></i><span>Play</span></button>
      <button id="t-pause" class="key" title="hold the sound where it is — the tape waits for you" disabled>
        <i data-icon="pause"></i><span>Pause</span></button>
      <button id="t-stop" class="key" title="cut it off and end the run" disabled>
        <i data-icon="stop"></i><span>Stop</span></button>
      <!-- The one thing a long reply asks for that Stop cannot give: enough
           of this line, and on to the next. It takes the floor away from what
           is speaking and leaves the tape running, so in a run the next turn
           starts straight away. -->
      <button id="t-skip" class="key" title="enough of this one — on to the next" disabled>
        <i data-icon="skip"></i><span>Skip</span></button>
      <!-- Two ways to put something on the tape, and they are not a choice
           between: the mic can be live while you type, which is what you want
           when the room is loud or a word will not come out. -->
      <!-- aria-pressed from the start, not from the first toggle: it is what
           makes these two switches rather than buttons, to a screen reader and
           to the ear both, and a key that only becomes a switch once you have
           already pressed it is neither. -->
      <button id="t-rec" class="key rec" aria-pressed="false" title="talk to it — the mic listens until you press it again">
        <i data-icon="record"></i><span>Talk</span></button>
      <button id="t-type" class="key rec" aria-pressed="false" title="write instead — return sends it">
        <i data-icon="record"></i><span>Type</span></button>
      <button id="t-eject" class="key" title="close the room and go back to the box">
        <i data-icon="eject"></i><span>Eject</span></button>
      <!-- Opened by the Type key, and in the row rather than above it: a
           field the width of the panel turns a machine into a form. Here it
           takes whatever the keys have left over, which on a desk is a good
           line's worth and on a phone is its own line under them. -->
      <div id="say" hidden>
        <!-- Two lines rather than one, and the height of the keys beside it.
             A single line the width of the panel is a form; two short ones
             are a note being written on the machine, which is what this is.
             Return sends, shift-return is a new line.

             The placeholder is short because the line is narrow: the keys have
             the row and the panel is set by the room, not the window, so this
             gets about a hundred pixels whatever the screen is doing. A hint
             that wraps inside its own box reads as something broken rather
             than as a hint, and it was doing exactly that. What it does not
             say any more is on the Type key, in its title, which is where
             somebody wondering about it will be looking. -->
        <textarea id="text" rows="2" spellcheck="false"
                  placeholder="type to steer"></textarea>
      </div>
      <!-- Two numbers, two things, and one tooltip each: a single sentence on
           the box round them is read over whichever one the pointer is
           nearest, describing the other.

           Neither says "length", though both are one. This counts lines and
           the other counts minutes, so calling either of them the length of
           the tape describes the pair and identifies nothing. -->
      <span id="counter">
        <b id="turns" title="how many lines have been said">000</b><b id="tape"><i>15</i><em>:</em><i>00</i></b></span>
    </div>
  </div>
  <!-- Nothing else. The dials that used to run along the bottom of this panel
       — three lamps, the memory, what the audio was doing, the last thing the
       server said — are all in the console, which is where the machine lives.
       What is left is the four things this panel is for. -->
</div>

<!-- Fixed over everything, so it stays out of the room's layout. -->
<div id="ask" hidden>
  <div class="askbox">
    <h2 id="asktitle"></h2>
    <p id="askbody"></p>
    <div class="askrow">
      <button id="askno">Cancel</button>
      <button id="askyes" class="danger">Reset</button>
    </div>
  </div>
</div>

<!-- The room this persona keeps. Two files out of its own bundle: room.js is
     the room itself — how big, what color, which wall the window is in, what
     stands on the floor — and room.css only dresses the flat things the room
     does not own, the panel and the words. A persona nobody has dressed yet
     gets the engine's own defaults, and it is still a room. -->
<script type="module">
  const slug = location.pathname.replace(/\/$/, '').split('/').pop();

  /* The room is built in a module and the websocket lives in a classic script
     below, so they cannot see each other's names. This object is the seam:
     what the server last said about the room, what the room wants saved, and
     the way to send it. Whichever script loads first makes it. */
  const link = window.RoomLink || (window.RoomLink = {last: null, pending: null});

  /* Into the console, whenever it turns up. This module runs before the
     shared script that builds the console, and the things worth saying here
     — a room that would not load, a machine with no WebGL — happen in that
     window. Waiting for `load` was not enough: a dynamic import can reject
     long after the page has finished loading, and the message went nowhere. */
  const tell = (text, level = 'error') => {
    let tries = 0;
    const go = () => {
      if (window.Hatch) return window.Hatch.say(text, level);
      if (++tries < 60) setTimeout(go, 100);
    };
    go();
  };

  const sheet = document.createElement('link');
  sheet.rel = 'stylesheet';
  sheet.href = `${slug}/room/room.css`;
  document.head.appendChild(sheet);

  /* Without a room. The conversation is the app; the room is what it happens
     in, and a machine that cannot draw one should still be able to talk. */
  const open = () => document.documentElement.classList.remove('waking');

  function flat(why) {
    document.documentElement.classList.add('flat');
    open();
    const glass = document.getElementById('glass');
    const panel = document.getElementById('panel');
    // The panel still stands in front of it, and out here nobody is measuring
    // the projection, so the last line is kept clear by hand.
    const clear = () => glass.style.setProperty('--under', panel.offsetHeight + 16 + 'px');
    clear();
    addEventListener('resize', clear);
    if (window.ResizeObserver) new ResizeObserver(clear).observe(panel);
    console.warn('lucid: no room —', why);
    /* And into the console, which is where somebody looks. A flat page is
       the app working correctly on a machine that cannot draw — but it is
       also what a broken room.js looks like, and those two want telling
       apart without opening the browser's own inspector. */
    tell('no room — ' + why);
  }

  // If the engine neither arrives nor fails — a stalled request, a machine
  // thinking about it far too long — the conversation still has to happen.
  const patience = setTimeout(() => {
    if (document.documentElement.classList.contains('waking')) flat('took too long');
  }, 8000);

  try {
    // Ask before importing 357K of engine: an old browser says no here.
    const probe = document.createElement('canvas');
    if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw 'no WebGL';

    const [engine, dressing] = await Promise.all([
      import('/shared/room3d.js'),
      /* A room that will not load is not a reason to lose the conversation —
         the engine's own defaults are a room. But it used to happen in total
         silence, so a typo in a persona's room.js looked exactly like a
         persona that had never been given one. */
      import(`./${slug}/room/room.js`).then(m => m.default).catch(e => {
        const why = `${slug}/room.js did not load — ${e && e.message || e}`;
        console.warn('lucid:', why);
        tell(why);
        return {};
      }),
    ]);
    // Exposed so the app can reach the room: the light knows how the pill is
    // holding you, and one day the room will show it.
    /* The phone's own bands, and the page behind everything, in the color of
       the room they are framing. Both are the void the room stands in: the
       thing you would see if the walls gave out, which is exactly what is
       past the edges of the screen. */
    const paintEdges = (spec) => {
      const hex = spec && spec.palette && spec.palette.void;
      if (typeof hex !== 'number') return;
      const css = '#' + hex.toString(16).padStart(6, '0');
      document.documentElement.style.background = css;
      const tag = document.querySelector('meta[name=theme-color]');
      if (tag) tag.content = css;
    };
    paintEdges(dressing);

    window.Room = engine.mount(dressing, {
      stage: document.getElementById('stage'),
      glass: document.getElementById('glass'),
      // What stands in front of the glass, so the conversation can keep its
      // last line clear of it — on a phone the panel is half the screen.
      under: document.getElementById('panel'),
    });

    /* What the room cannot know by itself: whose room this is, which
       conversation is in it, how the persona is set right now, and what the
       last save says was done to it. It arrives over the websocket, possibly
       long after this — the room is built to be told later.

       `lastRoom` is held here because the socket usually connects before the
       room finishes mounting, and because a room has to be able to say what
       it wants saved before there is a session to save it to: a click on a
       cold server is still a click. It is re-sent on reconnect for the same
       reason. */
    window.Room.room.knows({
      ...(link.last || {}),
      save(state) {
        // Held as well as sent: a click on a cold server is still a click,
        // and there is no session to keep it in until something is said.
        link.pending = state;
        if (link.send) link.send(state);
      },
      // What the room says a hand just did. Held the same way and for the
      // same reason: the press that starts an evening is usually the one that
      // happens before anything has finished connecting.
      did(text) {
        if (link.did) link.did(text);
        else (link.said || (link.said = [])).push(text);
      },
    });

    open();

    // A context can be taken away long after it was granted — another tab
    // wanting the GPU, a laptop waking up. Then the room goes and the
    // conversation stays.
    document.querySelector('#stage canvas').addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      if (window.Room) { window.Room.stop(); window.Room = null; }
      flat('context lost');
    });
  } catch (e) {
    flat(e && e.message || e);
  } finally {
    clearTimeout(patience);
  }
</script>
<!-- This page is one of the app's rooms, not its front door: the console
     offers the commands that need a conversation only where there is one. -->
<script>window.LucidWhere = 'room';</script>
<link rel="stylesheet" href="assets/sheets.css">
<script src="assets/sheets.js"></script>
<script src="/shared/qr.js?v=3"></script>
  <script src="/shared/night.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
// A phone has no push-to-talk, and claims the audio for itself.
const isPhone = window.matchMedia('(pointer:coarse)').matches;
let history = [];
let running = false, state = 'stopped', streaming = null;

let ws, retry = null, pending = [];
// Audio and key-state, sent many times a second: stale ones are worse than
// none, so these are dropped rather than queued when the socket is down.
const TRANSIENT = new Set(['mic_audio', 'audio_state', 'ptt']);

/* What this page came for, read off its address: /lucid-talk/lover?session=…
   is a pill and one of its conversations.

   The conversation belongs in the address too. There is still a single stack
   behind this — one model, one voice, one mic — so the server holds one
   conversation at a time and every page connected hears about it. That was
   fine while there was one window and unbearable with two: a room drew the
   other room's transcript, and one pill's voice came out of the other's
   speakers, with nothing on either page admitting what had happened.

   So each page knows which conversation is its own, and ignores everything
   addressed to another. When the machine has been taken to another window it
   says so, and offers to take it back, which is the honest version of a page
   that has quietly stopped meaning anything. */
const SLUG = location.pathname.replace(/\/$/, '').split('/').pop();
/* The addresses a browser trusts with no certificate at all. Declared up here
   because the microphone reads it, and the microphone can be asked for before
   the bottom of this file has run. */
const LOCAL = ['localhost', '127.0.0.1', '[::1]', '::1'].includes(location.hostname);
let SID = new URLSearchParams(location.search).get('session') || '';
// Waiting to hear that the machine is ours. True from the moment we ask until
// something addressed to us comes back — a page that has not been answered yet
// is not a page that has been taken from.
let claiming = true, claimedAt = 0;
// Whether this page has ever been connected. The first time it asks for what
// it came for; after that it only asks again if it still had the machine.
let arrived = false;

/* The address, once we know it. A conversation opened without one is still a
   conversation somebody may want to come back to, send to their phone, or
   open beside another — and until this line existed it had no address at all
   until the moment it scrolled off the History sheet. */
/* Asked for a new conversation, and waiting to be told its name.
 *
 * A page turns away everything addressed to another conversation, which is
 * what stops two windows from wearing each other's words — and a new
 * conversation is, for that one moment, another conversation. So the page has
 * to know it asked, and this is the knowing. */
let expecting = false, expectedAt = 0;
/* And not for long. The exception is "the conversation I just asked for", and
   what it recognizes is any message on this pill wearing another name — which
   is also an exact description of a second window on the same pill, talking.
   Left open, this page would quietly move into that conversation and both
   windows would answer to it. The answer to a /session_new comes back in well
   under a second; anything later than this is somebody else. */
const EXPECT_FOR = 8000;

function ownSession(id) {
  if (!id || id === SID) return;
  SID = id;
  const url = new URL(location.href);
  url.searchParams.set('session', id);
  // window.history: `history` in this file is the transcript, and has been
  // since before the address had anything in it worth replacing.
  window.history.replaceState(null, '', url);
}

/* Is this message about our conversation? Everything the server sends is
   stamped with the pill and the session it belongs to — see whose_msg in
   server.py. */
function mine(m) {
  if (!m.pill && !m.sid) return true;            // not about a conversation
  if (m.pill !== SLUG) return false;             // another pill entirely
  if (!SID) { ownSession(m.sid); }               // ours, and now we know its name
  /* Or one we asked for a moment ago. Everything else about another sid is
     somebody else's conversation and is turned away; this is the exception,
     and it is only an exception because the page said so first. */
  if (expecting && Date.now() - expectedAt > EXPECT_FOR) expecting = false;
  if (expecting && m.sid && m.sid !== SID) {
    expecting = false;
    SID = '';
    ownSession(m.sid);
    clearChat();
    streaming = null;
    paintCounter();
  }
  if (m.sid && m.sid !== SID) return false;      // this pill, another tape
  /* Something addressed to us is the proof that we have the machine, whenever
     it arrives. It used to clear the banner only while the page was still
     waiting on its own claim — so a claim that took longer than the five
     seconds of grace (a cold machine loading a voice will) declared the page
     stale, and then nothing ever un-declared it: every message afterwards was
     ours, was accepted, was drawn, and the banner over the keys went on
     saying another window had the machine for the rest of the evening. */
  claiming = false;
  if (elsewhere) setElsewhere(false);
  return true;
}

/* Something arrived for somebody else. While we are still waiting on our own
   claim that is ordinary — the machine is on its way over — so it is only
   worth saying once the answer is late. */
let elsewhere = false;
function notMine() {
  if (nowhere) return;          // already said what is wrong; see setGone
  if (claiming && Date.now() - claimedAt < 5000) return;
  claiming = false;
  setElsewhere(true);
}

function setElsewhere(on) {
  if (on === elsewhere) return;
  elsewhere = on;
  const bar = $('taken');
  if (bar) bar.hidden = !on;
  /* And the keys, here, on the change itself — because a page that has lost
     the machine stops being sent anything it will accept, so the tick that
     repaints the deck five times a second stops arriving too. Left to that,
     the keys would go on looking pressable until it got the machine back,
     which is precisely the window in which they must not. */
  if (typeof paintPlay === 'function') paintPlay();
  /* Again lives on the counter's paint, not the deck's, and the counter is
     painted by a new bubble — which is exactly what a page without the machine
     does not get. Left to that, taking the machine back left the key gray
     until the pill next spoke. */
  if (!on && typeof paintCounter === 'function') paintCounter();
  /* The microphone is a machine that is on, not a key that is lit: losing the
     floor has to actually close it, or this page goes on capturing a room it
     is no longer part of. Suspended rather than switched off, so taking the
     machine back reopens it — the same pair the page uses for a tab that went
     to the background, and for the same reason. */
  if (on) suspendMic('another window has the machine');
  /* And only when somebody is actually looking at this page. Taking the
     machine back is a message arriving, which can happen with the window
     behind three others — and asking for a microphone then is asking a
     browser for something it will not give a page nobody is looking at. */
  else if (!document.hidden && document.hasFocus()) resumeMic();
  if (on) log('another window has the machine — this page is showing an old view');
}

// Take it back: ask for our pill and our conversation again, which is the
// same thing this page asked for when it opened.
$('takeback').onclick = () => {
  claiming = true; claimedAt = Date.now();
  setElsewhere(false);
  send({cmd: 'open', slug: SLUG, session: SID});
};

function connect() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;   // already on it
  clearTimeout(retry); retry = null;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  // Relative to wherever this page is mounted — the shell gives each app a
  // route of its own, so the socket lives beside the page rather than at /ws.
  const base = location.pathname.replace(/[^/]*$/, '');
  ws = new WebSocket(`${proto}://${location.host}${base}ws`);
  ws.onopen = () => {
    reconciled = false;                  // a fresh socket, a fresh reckoning
    // Said first, and on every reconnect: the server holds one persona, and
    // this page is the one thing that knows who was asked for. It is ignored
    // when it is already this one, so a dropped socket costs no conversation.
    /* What this page came for, in one move: the pill, and — deep-linked from
       the dashboard, a bookmark, or a code scanned onto a phone — which of
       its conversations. It was two commands a tenth of a second apart and
       they raced, since switching pills opens a conversation of its own: the
       page could draw the most recent one and then jump. */
    /* A page claims the machine when it arrives, and on a *re*connect only if
       it had the machine when the socket went.

       This used to claim every time, which is how a phone left open in a
       pocket pulled a conversation out from under somebody at a desk: its
       wifi hiccupped, it reconnected, said what it had come for — another
       pill, an hour ago — and the desk found itself listening to the wrong
       voice mid-sentence. A page already showing "another window has the
       machine" has no business taking it back because its connection
       flickered. It waits, and the button says how to ask for it on purpose. */
    if (!arrived || !elsewhere) {
      claiming = true; claimedAt = Date.now();
      ws.send(JSON.stringify({cmd: 'open', slug: SLUG, session: SID}));
    }
    arrived = true;
    const queued = pending;
    pending = [];
    queued.forEach(o => ws.send(JSON.stringify(o)));
    if (queued.length) log('reconnected — sent that');
  };
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { retry = setTimeout(connect, 1000); log('disconnected — retrying'); };
}

// Restart the server with this page open and every command vanished here: the
// socket was closed, this returned false, and nothing said so. Pressing Start
// did nothing at all, and the press after it worked because the retry had
// landed in between. A command waits for the socket now instead.
/* What a page may still say once it has lost the machine.
 *
 * Everything else it might send acts on whatever conversation is live, which
 * is somebody else's — pressing Play in a window showing an old view started a
 * run in the room next door, and a line typed into it arrived in a
 * conversation with a different pill. These four are safe because none of them
 * is about the live conversation: asking for it back, and the three sheets,
 * which name the pill they are about and are read the same from anywhere.
 */
const STILL_ALLOWED = new Set(['open', 'sessions', 'memory_get', 'memory_save',
                               'relation_reset']);
const send = o => {
  if (elsewhere && !STILL_ALLOWED.has(o.cmd)) {
    /* Silently for the ones that repeat. An open microphone sends a packet
       eleven times a second and does not stop because a key went gray, so
       saying this each time wrote eleven lines a second into the console every
       window shares — for as long as the tab stayed open. What a person
       pressed is worth a line; what a stream does is not. */
    if (!TRANSIENT.has(o.cmd)) log('another window has the machine — that did nothing here');
    return false;

  + '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>'
  + '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  + '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>'

/* Two speakers: you, and the pill. Which pill is what the label says — Gold,

     as well — a thing done rather than a thing said. Same bubble, same side
     of the conversation, leaning. */

    + '<span class="tools">'
    + (mine ? '' : `<button class="replay" title="say it again">${SPEAKER_SVG}</button>`)
    + `<button class="del" title="delete this — from here and from the transcript">${TRASH_SVG}</button>`
    + '</span>';

  // whether they are still waiting on them. Before the filter below, because
  // a sheet's answer is addressed to whoever opened it and not to a
  // conversation.
  if (window.Sheets && Sheets.take(m)) return;

     in — it names what was asked for rather than what is live, and the filter
     below would turn it away as somebody else's. */

  // someone else's room, all silently dropped.

    case 'state': setState(m.state); break;

      // "no usable speech", "too short to hear", "STT failed" — nothing is
      // coming, so take the dots down and say why.

function setState(s) {

  if (s !== 'thinking' && s !== 'speaking') clearMusing();

  // transcript, so it is a wait, not a signal — two seconds of it means the
  // turn is not coming (transcription failed, or it was cut off).

  // seconds and the state passes through idle on the way, so a short idle

  // long timeout is only a backstop for a crash.

  // microphone that stopped existing — reading live, hearing nothing. Say so
  // once per connection: either the mic is gone, or the label is stale.

  const heard = live ? Math.min(1, m.level / Math.max(gate * 3, 0.02)) : 0;

  rec.style.setProperty('--beat', live && m.level > gate ? '.45s' : '1.6s');

     others to say a word most evenings never need. */

  // typed. Keep going needs a running stack to hand the wheel to.

// Asks, and resolves to what you chose. Escape or the backdrop is No, so the
// safe answer is always the easy one; No takes the focus for the same reason.
function ask(title, body, yes = 'Yes') {
  return new Promise(resolve => {
    $('asktitle').textContent = title;
    $('askbody').textContent = body;
    $('askyes').textContent = yes;
    $('ask').hidden = false;
    $('askno').focus();
    const done = answer => {
      $('ask').hidden = true;
      document.removeEventListener('keydown', onKey, true);
      resolve(answer);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
    };
    $('askyes').onclick = () => done(true);
    $('askno').onclick = () => done(false);
    $('ask').onclick = e => { if (e.target === $('ask')) done(false); };
    document.addEventListener('keydown', onKey, true);
  });
}

function paintCounter() {
  // Said, not being said: the heard-you line and the thinking dots are both
  // messages on the page and neither is a turn yet, so the number ran up and
  // back down again on every turn taken.
  const turns = $('chat').querySelectorAll('.msg:not(.pending)').length;
  $('turns').textContent = String(turns).padStart(3, '0');

  const left = continuous ? (tapeHeld ? tapeHeld / 1000
                                     : Math.max(0, (tapeEnds - Date.now()) / 1000))
                          : tapeMinutes * 60;
  const mm = Math.floor(left / 60), ss = Math.floor(left % 60);
  const box = $('tape');
  box.firstElementChild.textContent = String(mm).padStart(2, '0');
  box.lastElementChild.textContent = String(ss).padStart(2, '0');
  // Blinking is what a tape that is moving does; a held one stands still.
  box.classList.toggle('running', continuous && !held);
  box.classList.toggle('holding', continuous && held);
  box.classList.toggle('spent', continuous && left < 1);
  box.title = continuous ? 'how much of this dose is left'
                         : `a Play would run for ${tapeMinutes} minutes`;
  /* A blank tape cannot be played: the first word is yours, always, and until
     it is said the only lit key is the red one. */
  paintPlay();
  if ($('t-play').disabled) {
    $('t-play').title = 'say something first — a tape has to be recorded before it plays';
  }
  $('t-back').disabled = !lastSaid();
  lockDeck();
}

// The last thing the pill said, which is what Again says again.
function lastSaid() {
  /* Not the dots. While the pill is thinking there is a bubble on the page
     with its class and no words in it, and counting it enabled Again — which
     then asked for an empty line to be said over. `pending` is what marks it,
     and it is the same mark the counter uses. */
  const all = $('chat').querySelectorAll('.msg.pill:not(.pending)');
  return all.length ? all[all.length - 1] : null;
}
$('t-back').onclick = () => {
  const msg = lastSaid();
  if (!msg) return;
  send({cmd: 'replay', text: msg._raw !== undefined ? msg._raw : msg.querySelector('.body').textContent});
};
$('t-eject').onclick = () => { location.href = './'; };
$('goback').onclick = () => { location.href = './'; };

/* ---- the two ways of putting something on the tape ------------------------
   Talk opens the microphone; Type opens a line to write in. Both may be on:
   the mic can be live while you write, which is what you want when the room
   is loud or a word will not come out. Neither is a mode the other cancels.

   Which one you were last using is remembered, because it is a preference and
   not a state of the conversation. Before anything has been said the line is
   open whatever you did last: a blank tape needs an obvious way in, and a key
   labeled Type is not obvious enough to be the only one. */
const TYPING = 'lucid:typing';
function showType(on, focus = true) {
  $('say').hidden = !on;
  $('t-type').classList.toggle('armed', on);
  $('t-type').setAttribute('aria-pressed', on ? 'true' : 'false');
  $('t-type').querySelector('span').textContent = on ? 'Typing' : 'Type';
  $('t-type').title = on ? 'put the line away'
    : 'write instead — return sends it, shift-return is a new line';
  try { localStorage.setItem(TYPING, on ? '1' : '0'); } catch (e) {}
  if (on && focus) setTimeout(() => $('text').focus(), 30);
}
$('t-type').onclick = () => showType($('say').hidden);
(() => {
  /* Shut, unless you left it open.
   *
   * It used to be the other way about — open unless you had shut it, and open
   * regardless in a room where nothing had been said yet — which meant a line
   * to type into was waiting every time anybody walked into a room, whatever
   * they had come for. The microphone does not do that, and this is the same
   * kind of thing: a way in that you choose. The two record keys are sitting
   * there saying which two there are.
   */
  /* Shut by default — unless there is no microphone on this address, where
     typing is the only way in and a line waiting is the kindest thing there
     is. Either way a choice, once made, outranks both: it is a preference and
     not a suggestion, and forcing it open at every load meant it could never
     be turned off, because opening it writes it down again. */
  let want = !canBeHeard();
  try {
    const saved = localStorage.getItem(TYPING);
    if (saved !== null) want = saved === '1';
  } catch (e) {}
  showType(want, false);
})();
$('text').onkeydown = e => {
  /* Return sends; shift-return is a new line. Which is the way round every
     message box anybody has used works, and it is now a box with two lines in
     it rather than a field, so the question exists at all. */
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  // Escape puts the line away rather than leaving it open and empty. The
  // console has its own Escape and takes it first, so this only fires when
  // the console is shut.
  else if (e.key === 'Escape') { showType(false); $('text').blur(); }
};
// The on-screen keyboard shrinks the viewport; keep the latest reply in view.
if (window.visualViewport) {
  const bottom = () => keepDown(true);
  window.visualViewport.addEventListener('resize', bottom);
  $('text').addEventListener('focus', () => setTimeout(bottom, 250));
}

// Whatever was in the box when the page went away, plus anything sent that was
// never acknowledged — the window in which a message could be lost in transit.
// It comes back into the box rather than being re-sent, so you decide.
(() => {
  const back = [stored(UNSENT), stored(DRAFT)].filter(Boolean).join(' ').trim();
  if (!back) return;
  $('text').value = back;
  store(UNSENT, '');
  saveDraft();
  refreshSend();
  log('restored what you had typed');
})();

/* The deck, once, before anything has been said. Every key's state was worked
   out only when something arrived — a bubble, a tick, a run beginning — so a
   page that was never answered kept whatever the markup happened to say, and
   Again sat there lit over an empty room. Pressing it asked for the last line
   to be said again where there was no last line.

   Down here rather than beside paintCounter, because it reads the faces the
   keys are drawn with and those are declared further down the file. */
/* A microphone that cannot exist here.
 *
 * On an address a browser does not trust — which for this program means a
 * phone reaching the Mac over plain http — getUserMedia is not merely refused,
 * it is absent. There is nothing to press and no way to make it work from
 * this side, so the key goes rather than sitting there grayed or, worse,
 * lighting up and doing nothing.
 *
 * Everything else on the page still works: the voice plays, the room is there,
 * the line at the bottom sends. It is a remote, and a remote is a perfectly
 * good thing to be. */
function canBeHeard() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
         && window.isSecureContext;
}
if (!canBeHeard()) {
  $('t-rec').hidden = true;
  log('no microphone on this address — the voice still plays, and you can '
      + 'type. See MANUAL, “Your phone”.', 'warn');
}

paintCounter();

connect();
</script>
</body>
</html>
