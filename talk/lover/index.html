<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Before any stylesheet: the browser paints the blank canvas between two
     documents using this, and reads it while parsing the head. Declaring dark
     in CSS is too late — that is the white flash on navigation. -->
<meta name="color-scheme" content="dark">
<!-- Inline, and first: the bundle is a separate request, and a browser paints
     a new document before it arrives. Without this the first frame is white —
     invisible in Safari, which covers it with a view transition, and a flash
     in Firefox, which has none. -->
<style>html{background:#05060b}</style>
<!-- No zooming. This is a room drawn to the size of the screen, with a
     conversation projected onto a pane inside it — pinched to 1.4 it is a
     corner of a room and a column of type running off the edge, and a phone
     that zooms in on a focused field leaves it there. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- The bands a phone keeps for itself, above the notch and below the home
     bar. A starting value for the first paint; the room's own void takes it
     from here as soon as one is built. -->
<meta name="theme-color" content="#0a0610">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- PNG first, .ico last. A browser is entitled to take the first icon it
     understands, and every one of them understands a PNG; the .ico is here
     for the ones that ask the root of the site for that name and nothing
     else. The addresses are the server's own — public/shared mirrors them so
     they resolve in the dev server and in the built files alike. -->
